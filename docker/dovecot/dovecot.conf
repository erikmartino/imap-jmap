dovecot_config_version = 2.4.1
dovecot_storage_version = 2.4.1

base_dir = /run/dovecot
state_dir = /run/dovecot
log_path = /dev/stdout

protocols = imap lmtp

mail_driver = maildir
mailbox_list_layout = index
mailbox_list_utf8 = yes
mail_path = ~/Maildir
mail_home = /srv/vmail/%{user | lower}
mail_utf8_extensions = yes

mail_uid = vmail
mail_gid = vmail

# The imap-jmap gateway authenticates over cleartext LOGIN from another
# container on the internal Docker network; trust it so plaintext is allowed.
login_trusted_networks = 0.0.0.0/0 ::/0

# Cache successful authentications so the repeated per-request IMAP LOGINs of a
# webmail session are cheap.
auth_cache_size = 10 M
auth_cache_ttl = 1 hour

# Auth: any user logging in with the fixed backend password is accepted. The
# imap-jmap gateway enforces the dev username==password convention itself before
# it ever connects to Dovecot, so Dovecot never talks to the flaky mock LDAP
# server. The password must match IMAP_BACKEND_PASSWORD on the gateway side.
passdb static {
  password = imap-jmap-backend-pass
  default_password_scheme = plain
}

userdb static {
  fields {
    uid = 1000
    gid = 1000
    home = /srv/vmail/%{user | lower}
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

ssl = no
