dovecot_config_version = 2.4.1
dovecot_storage_version = 2.4.1

base_dir = /run/dovecot
state_dir = /run/dovecot
log_path = /dev/stdout

protocols = imap lmtp

mail_driver = maildir
mailbox_list_layout = index
mailbox_list_utf8 = yes
mail_path = ~/Maildir
mail_home = /srv/vmail/%{user | lower}
mail_utf8_extensions = yes

mail_uid = vmail
mail_gid = vmail

# The imap-jmap gateway authenticates over cleartext LOGIN from another
# container on the internal Docker network; trust it so plaintext is allowed.
login_trusted_networks = 0.0.0.0/0 ::/0

# Cache successful authentications so the repeated per-request IMAP LOGINs of a
# webmail session are cheap.
auth_cache_size = 10 M
auth_cache_ttl = 1 hour

# Auth: each account's password is validated per-user — the password must equal
# the username (the development convention used by the e2e suite). No shared
# backend secret, no LDAP, and the gateway can only ever connect as a user for
# whom it holds that user's own credentials. In a real deployment this passdb is
# replaced by the real auth source (LDAP/SQL/PAM) and the gateway simply passes
# the user's credentials through.
passdb static {
  password = %{user}
  default_password_scheme = plain
}

userdb static {
  fields {
    uid = 1000
    gid = 1000
    home = /srv/vmail/%{user | lower}
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

ssl = no
