services:
  imap-jmap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imap-jmap-server
    ports:
      - "8080:8080"
      - "8443:8443"
      - "1025:1025"
    environment:
      - PORT=8080
      - HTTPS_PORT=8443
      - HOST=0.0.0.0
      - SMTP_PORT=1025
      - SMTP_HOST=0.0.0.0
      - PUBLIC_URL=https://localhost:8443
      - TLS_CERT_FILE=/certs/cert.pem
      - TLS_KEY_FILE=/certs/key.pem
      - BACKEND_TYPE=imapsmtp
      - IMAP_SERVER=dovecot:143
      - SMTP_SERVER=smtp:25
      - IMAP_BACKEND_PASSWORD=imap-jmap-backend-pass
      - SESSION_SECRET=imap-jmap-secret-session-key-32b!
    volumes:
      - ./certs:/certs:ro
    depends_on:
      - dovecot
      - smtp
      - ldap
    restart: unless-stopped

  bulwark:
    image: ghcr.io/bulwarkmail/webmail:latest
    container_name: bulwark-webmail
    ports:
      - "3000:3000"
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NODE_ENV=development
      - JMAP_SERVER_URL=https://localhost:8443
      - ALLOW_CUSTOM_JMAP_ENDPOINT=true
      - STALWART_EXTENSIONS=false
    depends_on:
      - imap-jmap
    restart: unless-stopped

  stalwart:
    image: stalwartlabs/stalwart:latest
    container_name: stalwart-mail
    ports:
      - "8085:8080"
    restart: unless-stopped

  ldap:
    build:
      context: .
      dockerfile: docker/mock-ldap/Dockerfile
    container_name: ldap-server
    ports:
      - "4389:389"
    restart: unless-stopped

  dovecot:
    build:
      context: .
      dockerfile: docker/dovecot/Dockerfile
    image: imap-jmap-dovecot:latest
    container_name: dovecot-imapd
    ports:
      - "1143:143"
      - "1993:993"
    volumes:
      - ./docker/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - vmail-data:/srv/vmail
    depends_on:
      - ldap
    restart: unless-stopped

  radicale:
    image: tomsquest/docker-radicale:latest
    container_name: radicale-dav
    ports:
      - "5232:5232"
    volumes:
      - ./docker/radicale/config:/config/config:ro
      - radicale-data:/data
    depends_on:
      - ldap
    restart: unless-stopped

  smtp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smtp-server
    command: ["/mock-smtp"]
    ports:
      - "2525:25"
    environment:
      - SMTP_PORT=25
      - LDAP_HOST=ldap:389
    depends_on:
      - ldap
    restart: unless-stopped

volumes:
  radicale-data:
  vmail-data:
