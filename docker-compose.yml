services:
  imap-jmap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imap-jmap-server
    ports:
      - "8080:8080"
      - "8443:8443"
      - "1025:1025"
    environment:
      - PORT=8080
      - HTTPS_PORT=8443
      - HOST=0.0.0.0
      - SMTP_PORT=1025
      - SMTP_HOST=0.0.0.0
      - PUBLIC_URL=https://localhost:8443
      - TLS_CERT_FILE=/certs/cert.pem
      - TLS_KEY_FILE=/certs/key.pem
      - BACKEND_TYPE=imapsmtp
      - IMAP_SERVER=dovecot:143
      - SMTP_SERVER=smtp:25
      - SESSION_SECRET=imap-jmap-secret-session-key-32b!
      - NEXTCLOUD_URL=http://nextcloud:80
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=admin
    volumes:
      - ./certs:/certs
    depends_on:
      - dovecot
      - smtp
      - ldap
      - nextcloud
    restart: unless-stopped

  bulwark:
    image: ghcr.io/bulwarkmail/webmail:latest
    container_name: bulwark-webmail
    ports:
      - "3000:3000"
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NODE_ENV=development
      - JMAP_SERVER_URL=https://localhost:8443
      - ALLOW_CUSTOM_JMAP_ENDPOINT=true
      - STALWART_EXTENSIONS=false
    depends_on:
      - imap-jmap
    restart: unless-stopped

  twake:
    image: linagora/tmail-web:latest
    container_name: twake-webmail
    ports:
      - "3333:80"
    environment:
      - SERVER_URL=https://localhost:8443
      - DOMAIN_REDIRECT_URL=http://localhost:3333
      - WEB_OIDC_CLIENT_ID=teammail-web
      - PLATFORM=other
    command:
      - /bin/sh
      - -c
      - |
        cat <<EOF > /usr/share/nginx/html/assets/env.file
        SERVER_URL=$${SERVER_URL:-https://localhost:8443}
        DOMAIN_REDIRECT_URL=$${DOMAIN_REDIRECT_URL:-http://localhost:3333}
        WEB_OIDC_CLIENT_ID=$${WEB_OIDC_CLIENT_ID:-teammail-web}
        OIDC_SCOPES=openid,profile,email,offline_access
        PLATFORM=other
        EOF
        gzip -k -r -f /usr/share/nginx/html/
        nginx -g 'daemon off;'
    depends_on:
      - imap-jmap
    restart: unless-stopped

  stalwart:
    image: stalwartlabs/stalwart:latest
    container_name: stalwart-mail
    ports:
      - "8085:8080"
    restart: unless-stopped

  ldap:
    build:
      context: .
      dockerfile: docker/mock-ldap/Dockerfile
    container_name: ldap-server
    ports:
      - "4389:389"
    restart: unless-stopped

  dovecot:
    build:
      context: .
      dockerfile: docker/dovecot/Dockerfile
    image: imap-jmap-dovecot:latest
    container_name: dovecot-imapd
    ports:
      - "1143:143"
      - "1993:993"
    volumes:
      - ./docker/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - vmail-data:/srv/vmail
    depends_on:
      - ldap
    restart: unless-stopped

  nextcloud:
    image: nextcloud:apache
    container_name: nextcloud-server
    ports:
      - "8088:80"
    environment:
      - SQLITE_DATABASE=nextcloud
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=admin
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost nextcloud 127.0.0.1 imap-jmap bulwark
      - OVERWRITECLIURL=http://localhost:8088
      - OVERWRITEHOST=localhost:8088
      - OVERWRITEPROTOCOL=http
      - TRUSTED_PROXIES=0.0.0.0/0 ::/0
      - APACHE_DISABLE_REWRITE_IP=1
    volumes:
      - nextcloud-data:/var/www/html
    depends_on:
      - ldap
    restart: unless-stopped

  smtp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smtp-server
    entrypoint: ["/mock-smtp"]
    ports:
      - "2525:25"
    environment:
      - SMTP_PORT=25
      - LDAP_HOST=ldap:389
    depends_on:
      - ldap
    restart: unless-stopped

volumes:
  nextcloud-data:
  vmail-data:
