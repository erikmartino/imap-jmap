services:
  imap-jmap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imap-jmap-server
    ports:
      - "8080:8080"
      - "8443:8443"
      - "1025:1025"
    environment:
      - PORT=8080
      - HTTPS_PORT=8443
      - HOST=0.0.0.0
      - SMTP_PORT=1025
      - SMTP_HOST=0.0.0.0
      - PUBLIC_URL=https://localhost:8443
      - TLS_CERT_FILE=/certs/cert.pem
      - TLS_KEY_FILE=/certs/key.pem
    volumes:
      - ./certs:/certs:ro
    restart: unless-stopped

  bulwark:
    image: ghcr.io/bulwarkmail/webmail:latest
    container_name: bulwark-webmail
    ports:
      - "3000:3000"
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NODE_ENV=development
      - JMAP_SERVER_URL=https://localhost:8443
      - ALLOW_CUSTOM_JMAP_ENDPOINT=true
      - STALWART_EXTENSIONS=false
    depends_on:
      - imap-jmap
    restart: unless-stopped

  stalwart:
    image: stalwartlabs/stalwart:latest
    container_name: stalwart-mail
    ports:
      - "8085:8080"
    restart: unless-stopped

  ldap:
    build:
      context: .
      dockerfile: docker/mock-ldap/Dockerfile
    container_name: ldap-server
    ports:
      - "389:389"
    restart: unless-stopped

  dovecot:
    image: mailhog/dovecot:latest
    container_name: dovecot-imapd
    ports:
      - "143:143"
      - "993:993"
    depends_on:
      - ldap
    restart: unless-stopped

  radicale:
    image: tomsun/radicale:latest
    container_name: radicale-dav
    ports:
      - "5232:5232"
    volumes:
      - ./docker/radicale/config:/etc/radicale/config:ro
    depends_on:
      - ldap
    restart: unless-stopped
