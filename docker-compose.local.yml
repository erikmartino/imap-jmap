# Local-only override for environments where rootless container networking
# (pasta) cannot set up a bridge network (e.g. kernels without /dev/net/tun).
# Switches every service to host networking and frees the JMAP HTTP port so the
# container does not collide with other host listeners. Activated automatically
# by e2e/scripts/tldr.sh when present; never required on a normal Docker host.
services:
  imap-jmap:
    network_mode: host
    environment:
      - PORT=8081
  bulwark:
    network_mode: host
  stalwart:
    network_mode: host
    profiles: ["local-only"]
